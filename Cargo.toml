[workspace]
# Two crates, and there is a reason it is not one. `tinybus-macros` is a
# proc-macro crate, which means it compiles for the *host* even when the bus
# itself is cross-compiled; keeping it separate is the only way to have
# `#[interface]` without forcing that split on every downstream target.
# Integrations themselves are never workspace members — the whole point is that
# an integration is a separate process (or a separate crate in its own repo)
# that speaks the wire protocol. Adding an integration here would re-create the
# dependency blob we are trying to delete from the kernel.
members = ["crates/tinybus", "crates/tinybus-macros"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinybus"

[workspace.dependencies]
tinybus = { path = "crates/tinybus", version = "0.1.0" }
tinybus-macros = { path = "crates/tinybus-macros", version = "0.1.0" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
