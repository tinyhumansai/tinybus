[package]
name = "tinybus"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
build = "build.rs"
description = "A zbus-style message bus that keeps external integrations out of the OpenHuman kernel's dependency graph."
readme = "../../README.md"
keywords = ["bus", "ipc", "rpc", "integrations", "openhuman"]
categories = ["network-programming", "asynchronous"]
# Examples are declared explicitly, with the features they need, so an example
# can never be built by a `--no-default-features` CI job that has no transport
# compiled in.
autoexamples = false

[dependencies]
# --- always compiled: the offline core ---
# The bus core is a protocol, a router, and two seams (`Transport`, `Listener`).
# None of that needs a socket: the in-memory transport is always compiled, so
# `cargo test` runs an entire broker, several services and a client inside one
# process without opening a file descriptor. That invariant is what lets the
# kernel embed tinybus in a slim build and what keeps the test suite hermetic.
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "io-util"] }

tinybus-macros = { workspace = true, optional = true }

# --- optional: the CLI ---
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"], optional = true }
ureq = { version = "3.5", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
rawzip = { version = "0.5.2", optional = true }
icu_casemap = { version = "2.1", default-features = false, features = ["compiled_data"], optional = true }
unicode-normalization = { version = "0.1", default-features = false, optional = true }
tempfile = { version = "3", optional = true }
toml = { version = "1", optional = true }

# Unix only, for the module directory gate's passwd/group lookups
# (`getpwuid_r`, `getgrgid_r`), whose struct layouts differ per platform.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
# Explicit private native lifecycle fixture cohort; never part of defaults.
__native-fixture-support = ["tinybus-module/__native-fixture-support"]
# `uds` and `macros` are on by default because a bus you cannot connect to over
# a socket, and an interface you have to hand-dispatch, are not what anyone is
# installing. The CLI is opt-in: embedding the library should not pull in
# command parsing, log formatting, signal handling, or a multi-thread runtime.
default = ["uds", "macros"]

# Length-prefixed JSON over a Unix domain socket (Windows: named pipe, not yet
# implemented — see ROADMAP.md). This is the production transport.
uds = ["tokio/net", "tokio/io-util"]

# `#[tinybus::interface]`, the attribute that turns an `impl` block into a
# dispatchable interface.
macros = ["dep:tinybus-macros"]

# The `tinybus` binary: `serve`, `call`, `emit`, `list`, `monitor`, `doctor`.
# This is deliberately opt-in; the library never asks for a multi-threaded
# runtime or a log sink.
cli = [
    "dep:clap",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/signal",
    "uds",
    "dep:flate2",
    "dep:tar",
    "dep:rawzip",
    "dep:icu_casemap",
    "dep:unicode-normalization",
    "dep:tempfile",
]

# Load trusted, in-process cdylib modules. Off by default because a loaded
# module shares the host's address space and full privileges.
modules = ["tokio/rt-multi-thread", "dep:ureq", "dep:flate2", "dep:tar", "dep:rawzip", "dep:icu_casemap", "dep:unicode-normalization", "dep:tempfile", "dep:toml", "dep:libc"]

# Shared helpers for integration suites that load a built module cdylib.
test-support = ["modules", "macros"]


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "test-util"] }
tempfile = "3"
# `zip`'s `deflate-flate2` feature enables flate2 without selecting a backend.
# Keep the fixture writer self-contained in standalone test builds while the
# production loader continues to use its bounded rawzip implementation.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Archive writer used only to construct hostile ZIP regression fixtures. The
# production loader remains the bounded rawzip parser/extractor.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[[bin]]
name = "tinybus"
path = "src/bin/tinybus.rs"
required-features = ["cli"]

[[example]]
name = "voice_service"
test = true
required-features = ["uds", "macros", "cli"]

[[example]]
name = "kernel_client"
required-features = ["uds", "macros"]

[[example]]
name = "module_clock"
crate-type = ["cdylib"]
required-features = ["modules", "macros"]

[[example]]
name = "module_clock_two"
crate-type = ["cdylib"]
required-features = ["modules", "macros"]

[[example]]
name = "module_wrong_target"
crate-type = ["cdylib"]
required-features = ["modules"]

[[example]]
name = "github_module_host"
required-features = ["modules"]

[dev-dependencies.tinybus-module]
workspace = true

[[example]]
name = "module_context"
crate-type = ["cdylib"]
required-features = ["modules"]

[[example]]
name = "module_context_configured"
crate-type = ["cdylib"]
required-features = ["modules"]

[[example]]
name = "module_context_factory"
crate-type = ["cdylib"]
required-features = ["modules"]

[[example]]
name = "module_context_eager"
crate-type = ["cdylib"]
required-features = ["modules"]

[[example]]
name = "module_trusted_migration"
crate-type = ["cdylib"]
required-features = ["modules"]

[[example]]
name = "module_host_callback"
crate-type = ["cdylib"]
required-features = ["modules"]

[[example]]
name = "module_host_stream_callback"
crate-type = ["cdylib"]
required-features = ["modules"]

[[example]]
name = "module_controlled_init"
crate-type = ["cdylib"]
required-features = ["modules"]

[[example]]
name = "module_terminal"
crate-type = ["cdylib"]
required-features = ["modules"]
