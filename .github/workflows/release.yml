name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z) committed through a reviewed PR
        type: string
        required: true
      release_mode:
        description: Use the existing main-only path or the approved reviewed-epic path
        type: choice
        options: [main, reviewed-epic]
        default: main
        required: true
      reviewed_pr:
        description: Positive PR number whose merge commit the tag names (reviewed-epic mode only)
        type: number
        required: false
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      release_mode: ${{ steps.tag.outputs.release_mode }}
      reviewed_pr: ${{ steps.tag.outputs.reviewed_pr }}
    steps:
      - id: tag
        shell: bash
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'main' || inputs.release_mode }}
          REVIEWED_PR: ${{ inputs.reviewed_pr }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "tag must be v-prefixed semver" >&2
            exit 2
          }
          [[ "$RELEASE_MODE" == main || "$RELEASE_MODE" == reviewed-epic ]] || {
            echo "release_mode must be main or reviewed-epic" >&2
            exit 2
          }
          if [[ "$RELEASE_MODE" == reviewed-epic ]]; then
            [[ "$REVIEWED_PR" =~ ^[1-9][0-9]*$ ]] || {
              echo "reviewed_pr must be a positive integer in reviewed-epic mode" >&2
              exit 2
            }
          else
            [[ -z "$REVIEWED_PR" || "$REVIEWED_PR" == 0 ]] || {
              echo "reviewed_pr is only valid in reviewed-epic mode" >&2
              exit 2
            }
            REVIEWED_PR=""
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "release_mode=$RELEASE_MODE"
            # Supply a JSON number when the main path has no reviewed PR input.
            echo "reviewed_pr=${REVIEWED_PR:-0}"
          } >> "$GITHUB_OUTPUT"
  sdk-release:
    needs: resolve
    if: needs.resolve.outputs.release_mode == 'main'
    permissions:
      contents: write
    uses: tinyhumansai/.github/.github/workflows/sdk-release.yml@4adc1080fb495098e7af1aade82ed7e6e3c69bb7
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      package: tinybus
  sdk-reviewed-epic-release:
    needs: resolve
    if: needs.resolve.outputs.release_mode == 'reviewed-epic'
    permissions:
      contents: write
      pull-requests: read
      checks: read
      actions: read
    uses: tinyhumansai/.github/.github/workflows/sdk-reviewed-epic-release.yml@0cafb7aada1e706fa237948c52decd9b753b111c
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.version }}
      package: tinybus
      reviewed-pr: ${{ fromJSON(needs.resolve.outputs.reviewed_pr) }}
