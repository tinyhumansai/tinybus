name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-features

      # The configuration a slim OpenHuman build embeds: no socket, no
      # proc-macro, no CLI. It has to keep compiling, because it is the proof
      # that `ports` is a real seam rather than decoration.
      - name: Slim build
        run: cargo check --locked --no-default-features

      - name: Module loader without sockets
        run: cargo check --locked --no-default-features --features modules

      - name: Docs
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The bus is meant to be embeddable on every platform OpenHuman ships on. The
  # socket adapter remains Unix-only, while the in-process module transport
  # and dynamic loader are portable and run on both non-Linux targets.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo check --locked --no-default-features --features macros
      - name: Test
        run: cargo test --locked --no-default-features --features macros
      - name: Test modules without sockets
        run: cargo test --locked --no-default-features --features modules,macros

  modules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build example module
        run: cargo build --locked --example module_clock --example module_clock_two --example module_wrong_target --no-default-features --features modules,macros
      - name: Exercise the real loader (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          module=$(find target/debug/examples -maxdepth 1 -type f \( -name 'libmodule_clock.so' -o -name 'libmodule_clock.dylib' \) -print -quit)
          module_two=$(find target/debug/examples -maxdepth 1 -type f \( -name 'libmodule_clock_two.so' -o -name 'libmodule_clock_two.dylib' \) -print -quit)
          wrong_target=$(find target/debug/examples -maxdepth 1 -type f \( -name 'libmodule_wrong_target.so' -o -name 'libmodule_wrong_target.dylib' \) -print -quit)
          for artifact in "$module" "$module_two" "$wrong_target"; do
            if [ -z "$artifact" ] || [ ! -f "$artifact" ]; then
              echo "a module example artifact is missing; the loader tests would not exercise it" >&2
              exit 1
            fi
          done
          TINYBUS_TEST_MODULE="$PWD/$module" TINYBUS_TEST_MODULE_TWO="$PWD/$module_two" TINYBUS_TEST_WRONG_TARGET="$PWD/$wrong_target" cargo test --locked --no-default-features --features modules,macros -- --ignored
      - name: Exercise the real loader (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $private = Join-Path $PWD target/private-module-tests
          New-Item -ItemType Directory -Force $private | Out-Null
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $acl = [System.Security.AccessControl.DirectorySecurity]::new()
          $acl.SetOwner($identity.User)
          $acl.SetAccessRuleProtection($true, $false)
          $inherit = [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
            $identity.User,
            [System.Security.AccessControl.FileSystemRights]::FullControl,
            $inherit,
            [System.Security.AccessControl.PropagationFlags]::None,
            [System.Security.AccessControl.AccessControlType]::Allow
          )
          $acl.AddAccessRule($rule)
          Set-Acl -LiteralPath $private -AclObject $acl
          Copy-Item target/debug/examples/module_clock.dll $private
          Copy-Item target/debug/examples/module_clock_two.dll $private
          Copy-Item target/debug/examples/module_wrong_target.dll $private
          $mixed = Join-Path $private mixed
          New-Item -ItemType Directory -Force $mixed | Out-Null
          Set-Acl -LiteralPath $mixed -AclObject $acl
          Copy-Item target/debug/examples/module_clock.dll $mixed
          Copy-Item target/debug/examples/module_wrong_target.dll $mixed
          $module = (Get-ChildItem "$private/module_clock.dll" | Select-Object -First 1).FullName
          $moduleTwo = (Get-ChildItem "$private/module_clock_two.dll" | Select-Object -First 1).FullName
          $wrongTarget = (Get-ChildItem "$private/module_wrong_target.dll" | Select-Object -First 1).FullName
          $env:TEMP = $private
          $env:TMP = $private
          $env:TINYBUS_TEST_MODULE = $module
          $env:TINYBUS_TEST_MODULE_TWO = $moduleTwo
          $env:TINYBUS_TEST_WRONG_TARGET = $wrongTarget
          $env:TINYBUS_TEST_MODULE_DIRECTORY = $mixed
          cargo test --locked --no-default-features --features modules,macros -- --ignored
