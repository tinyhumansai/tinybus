[package]
name = "tinybus-examples"
version = "0.1.0"
edition = "2024"
publish = false

# This package is a separate integration-style dependency graph, not a member
# of tinybus's kernel workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinybus = { path = "../crates/tinybus", features = ["uds", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
